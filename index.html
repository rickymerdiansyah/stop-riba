<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#101215;--card:#1A1D22;--line:#2A2E35;--tx:#F3F1EC;--mu:#A3A9B1;--acc:#E5372B;--ok:#2BB3A3;--warn:#F2A33A;--in:#0C0E10}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(110px + env(safe-area-inset-bottom))}
.h{font-family:'Space Grotesk',sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.mu{color:var(--mu)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column}
.stack{display:flex;flex-direction:column;gap:12px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:4px}
.btn{min-height:48px;border-radius:14px;border:0;font-weight:700;font-size:15px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-p{background:var(--acc);color:#fff}
.btn-w{background:#fff;color:#101215}
.btn-g{background:var(--card);border:1px solid var(--line);color:var(--tx)}
.btn-d{background:transparent;border:1px solid #6B2A25;color:#FF8E84}
.btn-icon{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.pill{font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;color:var(--mu)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#16191D;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav-in{max-width:480px;margin:0 auto;height:68px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mu);min-height:56px;cursor:pointer}
.nav button.on{color:var(--tx);font-weight:600}
.nav .fab{justify-self:center;width:54px;height:54px;min-height:54px;border-radius:27px;background:var(--acc);color:#fff}
.full{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#15181C;width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
input,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--in);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 12px;width:100%;color-scheme:dark}
textarea{padding:12px;min-height:130px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
input:focus,textarea:focus,button:focus-visible{outline:2px solid #fff;outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.err{color:#FF8E84;font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:#F3F1EC;color:#101215;border-radius:14px;padding:8px 8px 8px 16px;display:flex;gap:12px;align-items:center;z-index:60;font-size:14px;font-weight:600;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast button{background:#101215;color:#fff;border:0;border-radius:10px;min-height:40px;padding:0 12px;font-weight:700;cursor:pointer}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{height:46px;border-radius:10px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;cursor:pointer;color:var(--tx);padding:0}
.dot{width:6px;height:6px;border-radius:3px;display:inline-block}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--in);padding:4px;border-radius:14px}
.seg button{min-height:42px;border:0;border-radius:11px;background:transparent;color:var(--mu);font-weight:600;font-size:13px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx)}
.typechip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;cursor:pointer;color:var(--tx)}
.typechip.on{background:#fff;color:#101215;border-color:#fff}
.list-btn{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;color:var(--tx);display:block}
.sec{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;margin:10px 0 0}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;background:var(--in);min-height:48px}
.stepper button{width:48px;height:46px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--tx);flex:none}
.stepper input{border:0;text-align:center;background:none;min-height:44px;padding:0;width:100%;min-width:0}
.ck{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.ck span{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:2px solid #5C626B}
.ck.on span{background:var(--ok);border-color:var(--ok);color:#06231F}
.irow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);min-height:60px}
.irow:last-child{border-bottom:0}
.irow .body{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;text-align:left;cursor:pointer;min-height:58px;padding:0 6px 0 0;color:var(--tx)}
.sched{font-size:13px;display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line)}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.small{font-size:12px}
.b{font-weight:700}
.tog-row{width:100%;min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--tx);cursor:pointer;padding:0;font:inherit}
.tog-row:last-child{border-bottom:0}
.tog-row:disabled{cursor:default}
.tog{width:48px;height:28px;border-radius:14px;background:#3A3F47;position:relative;flex:none;display:block}
.tog i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;display:block;transition:left .15s}
.tog.on{background:var(--acc)}
.tog.on i{left:23px}
.empty{text-align:center;padding:48px 12px;display:flex;flex-direction:column;gap:14px;align-items:center}
</style>
</head>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
var DEFAULT_TYPES=[{name:'Kartu kredit',color:'#E8E4DC',mode:'bulanan',ojk:false},{name:'Pinjol',color:'#FF5A4E',mode:'harian',ojk:true},{name:'Paylater',color:'#F2A33A',mode:'bulanan',ojk:true},{name:'KTA',color:'#4C8DF6',mode:'bulanan',ojk:false}];
var SWATCH=['#E8E4DC','#FF5A4E','#F2A33A','#4C8DF6','#2BB3A3','#A68BF2','#F472B6','#84CC16'];
function types(){return state.settings.types;}
function typeOf(n){var t=types();for(var k=0;k<t.length;k++)if(t[k].name===n)return t[k];return {name:n,color:'#A68BF2',mode:'bulanan',ojk:false};}
function tcol(n){return typeOf(n).color;}
var BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var HARI=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
var LS_KEY='stopriba.v1';
function pad(n){return String(n).padStart(2,'0');}
function toISO(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayISO(){return toISO(new Date());}
function parseISO(s){var a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function dim(y,m){return new Date(y,m+1,0).getDate();}
function addMonths(iso,k){var a=iso.split('-').map(Number);var t=new Date(a[0],a[1]-1+k,1);return toISO(new Date(t.getFullYear(),t.getMonth(),Math.min(a[2],dim(t.getFullYear(),t.getMonth()))));}
function addDays(iso,k){var d=parseISO(iso);d.setDate(d.getDate()+k);return toISO(d);}
function daysBetween(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000);}
function dec(s){var v=parseFloat(String(s==null?'':s).replace(',','.'));return isNaN(v)?0:v;}
function pct2(n){return (Math.round(n*1000)/1000).toString().replace('.',',')+'%';}
function daysUntil(iso){return Math.round((parseISO(iso)-parseISO(todayISO()))/86400000);}
function fmtD(iso){var d=parseISO(iso);return d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear();}
function fmtDW(iso){var d=parseISO(iso);return HARI[d.getDay()]+', '+d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear();}
function rp(n){return 'Rp '+Math.round(n||0).toLocaleString('id-ID');}
function shortRp(n){n=Math.round(n||0);if(n>=1e9)return (n/1e9).toFixed(2).replace('.',',')+' M';if(n>=1e6)return (n/1e6).toFixed(2).replace('.',',')+' jt';if(n>=1e3)return Math.round(n/1e3)+' rb';return String(n);}
function num(s){return Number(String(s==null?'':s).replace(/[^\d]/g,''))||0;}
function fmtNum(n){return n?Number(n).toLocaleString('id-ID'):'';}
function pct(n){return (Math.round(n*10)/10).toString().replace('.',',')+'%';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function newId(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36);}
function clone(o){return JSON.parse(JSON.stringify(o));}
var IC={home:'<path d="M3 10.5 12 3l9 7.5V21H3z"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',chart:'<path d="M3 20h18M6 16l4-5 4 3 5-7"/>',more:'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="M20 6 9 17l-5-5"/>',back:'<path d="m15 18-6-6 6-6"/>',next:'<path d="m9 18 6-6-6-6"/>',edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',cloud:'<path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9z"/>',phone:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>',zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'};
function ic(k,s,w){s=s||20;w=w||2;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[k]+'</svg>';}
var LOGO='<svg width="28" height="28" viewBox="0 0 30 30" aria-hidden="true"><polygon points="9,1 21,1 29,9 29,21 21,29 9,29 1,21 1,9" fill="#E5372B"/><rect x="8" y="13.5" width="14" height="3" rx="1.5" fill="#fff"/></svg>';

/* ---------- state & storage ---------- */
var state={debts:[],settings:{},updatedAt:0};
function ensureSettings(){var s=state.settings=state.settings||{};if(s.gaji==null)s.gaji=0;if(!s.batas)s.batas=30;if(s.capShort==null)s.capShort=0.3;if(s.capLong==null)s.capLong=0.2;if(!Array.isArray(s.types)||!s.types.length)s.types=clone(DEFAULT_TYPES);
  if((state.debts||[]).length)s.onboarded=true;
  (state.debts||[]).forEach(function(d){if(!d.risk)d.risk=null;if(!d.mode)d.mode='bulanan';if(d.admin==null)d.admin=0;if(!d.cair)d.cair=d.mode==='harian'?addDays(d.firstDue,-30):addMonths(d.firstDue,-1);if(!s.types.some(function(t){return t.name===d.type;}))s.types.push({name:d.type,color:'#A68BF2',mode:'bulanan',ojk:false});});}
ensureSettings();
var ui={tab:'home',calYM:todayISO().slice(0,7),selDay:null,strat:'ava',detail:null,form:null,sheet:null};
var sync='local';
function loadLocal(){try{var r=localStorage.getItem(LS_KEY);if(r){var s=JSON.parse(r);if(s&&Array.isArray(s.debts))state=s;}}catch(e){}ensureSettings();}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
var docRef=null,saving=false,pendingSave=false,saveTimer=null;
function setSync(s){sync=s;var el=document.getElementById('syncpill');if(el)el.outerHTML=syncPill();}
function scheduleCloud(){if(!docRef)return;clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);}
function flush(){if(!docRef)return;if(saving){pendingSave=true;return;}saving=true;setSync('saving');
  docRef.set({v:1,updatedAt:state.updatedAt,state:clone(state)}).then(function(){setSync('cloud');},function(e){if(e&&e.code==='invalid_argument'){docRef=null;setSync('local');}else setSync('error');}).then(function(){saving=false;if(pendingSave){pendingSave=false;flush();}});}
function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function'){setSync('local');return;}
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user){setSync('local');return;}
    return user.id().then(function(id){
      if(!id){setSync('local');return;}
      var ref=db.doc('data/users/'+id+'/stopriba');
      var timer=setTimeout(function(){setSync('offline');},10000);
      return ref.get().then(function(snap){
        clearTimeout(timer);docRef=ref;
        if(snap.exists){var body=snap.data();if(body&&body.state&&(body.updatedAt||0)>=(state.updatedAt||0)){state=clone(body.state);ensureSettings();if(state.settings.onboarded)ui.onb=null;saveLocal();render();setSync('cloud');}else{setSync('cloud');scheduleCloud();}}
        else{setSync('cloud');if(state.debts.length)scheduleCloud();}
      },function(){clearTimeout(timer);setSync('local');});
    });
  }).catch(function(){setSync('local');});
}
var undoSnap=null;
function commit(msg,undo){if(undo)undoSnap=undo;state.updatedAt=Date.now();saveLocal();scheduleCloud();render();if(msg)toast(msg,!!undo);}

/* ---------- domain ---------- */
/* spec: {kembali,tenor,mode:'bulanan'|'harian',firstDue,cair,hari} */
function modeLbl(m){return m==='harian'?'Per hari':m==='manual'?'Manual':'Tiap bulan';}
function dueDates(sp){if(sp.rows)return sp.rows.map(function(r){return r.due;});var a=[];for(var i=0;i<sp.tenor;i++)a.push(sp.mode==='harian'?addDays(sp.cair,Math.round((i+1)*sp.hari/sp.tenor)):addMonths(sp.firstDue,i));return a;}
function buildInst(sp,prev,paidCount){if(sp.rows){return sp.rows.map(function(r,i){var amt=r.amt!=null?r.amt:(r.pokok+r.bunga),p=prev&&prev[i];var o={n:i+1,due:r.due,amount:amt,paidAt:null,paidAmount:0};if(p&&p.paidAt){o.paidAt=p.paidAt;o.paidAmount=p.paidAmount;}else if(paidCount&&i<paidCount){o.paidAt=r.due;o.paidAmount=amt;}return o;});}var kembali=sp.kembali,tenor=sp.tenor,dd=dueDates(sp);var per=Math.floor(kembali/tenor),out=[];for(var i=0;i<tenor;i++){var amount=i===tenor-1?kembali-per*(tenor-1):per;var due=dd[i];var p=prev&&prev[i];var o={n:i+1,due:due,amount:amount,paidAt:null,paidAmount:0};if(p&&p.paidAt){o.paidAt=p.paidAt;o.paidAmount=p.paidAmount;}else if(paidCount&&i<paidCount){o.paidAt=due;o.paidAmount=amount;}out.push(o);}return out;}
/* Rates. pinjaman = pokok di kontrak; admin = potongan di awal; dana diterima = pinjaman - admin.
   Flat (cara OJK / brosur): total biaya / pokok / jumlah hari.
   Efektif (bunga riil): IRR harian dari arus kas (terima dana di tanggal cair, bayar tiap tenor), dikonversi ke per bulan. */
function calcRates(o){var P=o.pinjaman||0,adm=o.admin||0,recv=P-adm,flows=o.flows||[],tot=0;flows.forEach(function(f){tot+=f.amt;});
  var biaya=Math.max(0,tot-P+adm),lastDue=flows.length?flows[flows.length-1].due:o.cair,days=Math.max(1,o.cair&&lastDue?daysBetween(o.cair,lastDue):30*(o.tenor||1));
  var r={biaya:biaya,days:days,pctPokok:P?biaya/P*100:0,flatHari:0,flatBulan:0,effBulan:0,effTahun:0,cap:null,over:false};
  if(!P||!recv||recv<=0||!flows.length)return r;
  r.flatHari=biaya/P/days*100;
  r.flatBulan=o.mode!=='bulanan'?r.flatHari*30:biaya/P/(o.tenor||1)*100;
  var t=flows.map(function(f){return Math.max(1,daysBetween(o.cair,f.due));});
  function npv(x){var s=-recv;for(var k=0;k<flows.length;k++)s+=flows[k].amt/Math.pow(1+x,t[k]);return s;}
  if(npv(0)>0){var lo=0,hi=0.05;for(var it=0;it<80;it++){var mid=(lo+hi)/2;if(npv(mid)>0)lo=mid;else hi=mid;}var rd=(lo+hi)/2;r.effBulan=(Math.pow(1+rd,365/12)-1)*100;r.effTahun=r.effBulan*12;}
  if(o.ojk){r.cap=days<=180?state.settings.capShort:state.settings.capLong;r.over=r.flatHari>r.cap+1e-9;}
  return r;}
function debtRates(d){return calcRates({pinjaman:d.pinjaman,admin:d.admin,cair:d.cair,mode:d.mode,tenor:d.inst.length,ojk:typeOf(d.type).ojk,flows:d.inst.map(function(i){return {due:i.due,amt:i.amount};})});}
function stats(d){var total=0,paid=0,sisa=0,cnt=0,paidBase=0,extra=0,next=null,last=null;d.inst.forEach(function(i){total+=i.amount;if(i.paidAt){paid+=i.paidAmount;cnt++;paidBase+=i.amount;extra+=Math.max(0,i.paidAmount-i.amount);}else{sisa+=i.amount;if(!next)next=i;last=i;}});var sisaPokok=null;if(d.mode==='manual'){sisaPokok=0;d.inst.forEach(function(i){if(!i.paidAt)sisaPokok+=(i.pokok!=null?i.pokok:i.amount);});}var R=debtRates(d),bunga=R.biaya;return {sisaPokok:sisaPokok,total:total,paid:paid,sisa:sisa,cnt:cnt,n:d.inst.length,bunga:bunga,bungaPaid:total?bunga*paidBase/total:0,rate:R.effBulan,R:R,next:next,last:last,done:!next,pctPaid:total?paidBase/total*100:0,extra:extra};}

<span class="b" style="font-size:14px">'+rp(st.bungaPaid)+'</span></span></div><div style="border-top:1px solid var(--line);padding-top:12px" class="stack">'+ratesHTML(st.R,d.mode!=='bulanan')+'</div>'+(d.payoff?'<span class="small" style="color:#6EDBCD">Dilunasi dipercepat '+fmtD(d.payoff.date)+' sebesar '+rp(d.payoff.amount)+(d.payoff.saved>0?' · hemat '+rp(d.payoff.saved):'')+'</span>':'')+'</div>';

/* ---------- form ---------- */
/* Semua jadwal = daftar angsuran {due, amt}. Tiap bulan / per hari: tanggal dibuat otomatis, nominal dibagi rata
   tapi bisa diedit per cicilan. Manual: tanggal & angsuran diisi sendiri. Nominal pengembalian = total angsuran. */
function sumRows(f){return f.rows.reduce(function(a,r){return a+(r.amt||0);},0);}
function genDates(f){return dueDates({mode:f.sched,tenor:Math.max(1,f.tenor||1),firstDue:f.firstDue,cair:f.cair,hari:f.hari});}
function regen(f,reset){if(f.sched==='manual')return;if(!isDate(f.firstDue)||!isDate(f.cair))return;var dd=genDates(f),n=dd.length,old=f.rows;
  if(reset||!f.amtEdited){var k=f.kembali||0,per=Math.floor(k/n);f.rows=dd.map(function(due,i){return {due:due,amt:i===n-1?k-per*(n-1):per};});}
  else{var last=old.length?old[old.length-1].amt:0;f.rows=dd.map(function(due,i){return {due:due,amt:old[i]?old[i].amt:last};});f.kembali=sumRows(f);f.bunga=Math.max(0,f.kembali-(f.pinjaman||0));}}
function newRow(f){var rs=f.rows,last=rs[rs.length-1];if(!last)return {due:addMonths(f.cair||todayISO(),1),amt:0};var due;if(rs.length>=2){var gap=daysBetween(rs[rs.length-2].due,last.due);due=(gap>=27&&gap<=31)?addMonths(last.due,1):addDays(last.due,Math.max(1,gap));}else due=addMonths(last.due,1);return {due:due,amt:last.amt};}
function openForm(d){
  if(d)ui.form={mode:'edit',id:d.id,type:d.type,name:d.name,pinjaman:d.pinjaman,admin:d.admin||0,diterima:d.pinjaman-(d.admin||0),dtTouched:true,kembali:0,bunga:0,dueMax:d.inst[d.inst.length-1].due,tenor:d.inst.length,sched:d.mode||'bulanan',firstDue:d.inst[0].due,cair:d.cair||todayISO(),hari:d.hari||d.inst.length*30,rows:d.inst.map(function(i){return {due:i.due,amt:i.amount};}),amtEdited:true,risk:clone(d.risk||typeRisk(d.type)),paidCount:0,err:''};
  else{var t=types()[0];ui.form={mode:'add',type:t.name,name:'',pinjaman:0,admin:0,diterima:0,dtTouched:false,bunga:0,kembali:0,tenor:t.mode==='harian'?3:12,sched:t.mode,firstDue:addMonths(todayISO(),1),cair:todayISO(),dueMax:t.mode==='harian'?addDays(todayISO(),90):addMonths(todayISO(),12),hari:90,rows:[],amtEdited:false,risk:typeRisk(t.name),paidCount:0,err:''};}
  var f=ui.form;if(f.mode==='edit'){f.kembali=sumRows(f);f.bunga=Math.max(0,f.kembali-f.pinjaman);f.hari=Math.max(1,daysBetween(f.cair,f.dueMax));}
  else{syncDates(f);regen(f,true);if(f.sched==='manual'&&!f.rows.length)f.rows.push(newRow(f));}
  render();var el=document.getElementById('sc-form');if(el)el.scrollTop=0;}
function applySched(f,m){var from=f.sched;f.sched=m;if(m==='manual'){if(!f.rows.some(function(r){return r.amt>0;}))f.rows=[];if(!f.rows.length)f.rows.push(newRow(f));f.kembali=sumRows(f);f.bunga=Math.max(0,f.kembali-(f.pinjaman||0));}else{if(from==='manual'){f.tenor=Math.max(1,f.rows.length||f.tenor);}f.amtEdited=false;syncDates(f);regen(f,true);}}
function syncDates(f){if(isDate(f.cair)&&isDate(f.dueMax)){f.hari=Math.max(1,daysBetween(f.cair,f.dueMax));f.firstDue=addMonths(f.dueMax,-(Math.max(1,f.tenor||1)-1));}}
function setTop(f,skip){['diterima','bunga','kembali'].forEach(function(x){if(x===skip)return;var el=document.querySelector('#sc-form input[data-f="'+x+'"]');if(el)el.value=fmtNum(f[x]);});var p=document.getElementById('fpot');if(p)p.innerHTML=potHTML();}
function redrawRows(){var el=document.getElementById('frows');if(el)el.innerHTML=rowsHTML();var b=document.getElementById('frows-head');if(b)b.innerHTML=rowsHeadHTML();}
function syncMoney(f,k){if(k==='pinjaman'&&!f.dtTouched)f.diterima=f.pinjaman;if(k==='diterima')f.dtTouched=true;f.admin=Math.max(0,(f.pinjaman||0)-(f.diterima||0));
  var locked=f.sched==='manual'||(f.amtEdited&&k!=='bunga'&&k!=='kembali');
  if(locked){f.kembali=sumRows(f);f.bunga=Math.max(0,f.kembali-(f.pinjaman||0));}
  else{if(k==='kembali')f.bunga=Math.max(0,(f.kembali||0)-(f.pinjaman||0));else f.kembali=(f.pinjaman||0)+(f.bunga||0);f.amtEdited=false;regen(f,true);redrawRows();}
  setTop(f,k);}
function potHTML(){var f=ui.form,bad=f.diterima>f.pinjaman;return bad?'<span class="err">Pinjaman diterima lebih besar dari nominal pinjaman.</span>':'<span class="mu">Potongan di awal (admin, asuransi)</span><span class="b">'+rp(f.admin)+'</span>';}
function stepInfo(){var f=ui.form;if(!isDate(f.dueMax)||!f.tenor)return '';return f.sched==='harian'?'Bayar tiap ±'+Math.max(1,Math.round((f.hari||0)/f.tenor))+' hari':'Cicilan 1: '+fmtD(f.firstDue)+', terakhir '+fmtD(f.dueMax);}
function lamaHTML(){var f=ui.form;if(!isDate(f.cair)||!isDate(f.dueMax))return 'Isi tanggal cair dan due date.';var n=daysBetween(f.cair,f.dueMax);return n<=0?'<span class="err">Due date harus setelah tanggal dana cair.</span>':'Lama pinjaman <b style="color:var(--tx)">'+n+' hari</b> (±'+(Math.round(n/30.4*10)/10).toString().replace('.',',')+' bulan)';}
function sortedRows(){return ui.form.rows.slice().sort(function(a,b){return a.due<b.due?-1:a.due>b.due?1:0;});}
function formSpec(){var f=ui.form,rs=f.sched==='manual'?sortedRows():f.rows;return {mode:f.sched,rows:rs,kembali:sumRows(f),tenor:rs.length,cair:f.cair,hari:f.hari,firstDue:rs.length?rs[0].due:f.firstDue};}
function isDate(x){return /^\d{4}-\d{2}-\d{2}$/.test(x||'');}
function formReady(){var f=ui.form;return isDate(f.cair)&&f.rows.length>0&&f.rows.every(function(r){return isDate(r.due)&&r.amt>0;});}
function sumHTML(){var f=ui.form,tot=sumRows(f),late=f.rows.some(function(r){return isDate(f.dueMax)&&r.due>f.dueMax;}),zero=f.rows.some(function(r){return !(r.amt>0);});
  return '<div class="card" style="background:#0C0E10;padding:12px 14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12px"><span class="col" style="gap:2px"><span class="mu">Jumlah cicilan</span><span class="b" style="font-size:14px">'+f.rows.length+'x</span></span><span class="col" style="gap:2px"><span class="mu">Total angsuran</span><span class="b" style="font-size:14px">'+rp(tot)+'</span></span><span class="col" style="gap:2px"><span class="mu">Bunga + biaya</span><span class="b" style="font-size:14px;color:#FF7A6F">'+rp(Math.max(0,tot-(f.pinjaman||0)+(f.admin||0)))+'</span></span></div>'+(f.pinjaman&&tot&&tot<f.pinjaman?'<div class="err">Total angsuran lebih kecil dari nominal pinjaman.</div>':'')+(late?'<div class="err">Ada cicilan yang lewat due date pengembalian.</div>':'')+(zero&&tot?'<div class="err">Ada cicilan yang angsurannya masih kosong.</div>':'');}
function formCalcHTML(){var f=ui.form,sp=formSpec(),p=f.pinjaman,k=sp.kembali,t=sp.tenor;var bad=k&&p&&k<p;
  if(!p||!k||bad||!formReady())return '<div class="card mu" style="background:#0C0E10;font-size:13px">Lengkapi nominal, tanggal, dan angsuran untuk lihat bunga flat, bunga efektif, dan cek batas OJK.</div>';
  var R=calcRates({pinjaman:p,admin:f.admin,cair:f.cair,mode:f.sched,tenor:t,ojk:typeOf(f.type).ojk,flows:sp.rows.map(function(r){return {due:r.due,amt:r.amt};})});
  return '<div class="card stack" style="background:#0C0E10;padding:14px">'+ratesHTML(R,f.sched!=='bulanan')+'<span class="mu" style="font-size:11px;line-height:1.5">Flat = total biaya ÷ pokok ÷ jumlah hari (cara OJK menghitung batas). Efektif = bunga riil dari dana yang benar-benar lo terima dan jadwal bayarnya.</span></div>';}
function rowsHeadHTML(){var f=ui.form;if(f.sched==='manual')return '<span class="b" style="font-size:14px">Angsuran per cicilan</span><span class="mu small" style="line-height:1.5">Isi tanggal dan angsuran sesuai rincian tagihan di aplikasi. Nominal pengembalian dan bunga dihitung dari totalnya.</span>';
  return '<div class="row between"><span class="b" style="font-size:14px">Angsuran per cicilan</span>'+(f.amtEdited?'<button class="btn" style="background:none;color:#FF8E84;min-height:36px;padding:0;font-size:13px" data-act="resplit">Bagi rata ulang</button>':'')+'</div><span class="mu small" style="line-height:1.5">'+(f.amtEdited?'Angsuran sudah diedit. Nominal pengembalian dan bunga mengikuti total angsuran.':'Dibagi rata dari nominal pengembalian. Ubah angsuran yang beda dari aslinya, total & bunga ikut menyesuaikan.')+'</span>';}
function rowsHTML(){var f=ui.form,man=f.sched==='manual',pc=f.mode==='add'?f.paidCount:0;

  fType:function(ds){var f=ui.form;f.type=ds.v;if(f.mode==='add'){var t=typeOf(ds.v);f.risk=typeRisk(ds.v);if(f.sched!==t.mode)applySched(f,t.mode);}render();},
  fSched:function(ds){applySched(ui.form,ds.v);render();},
  resplit:function(){var f=ui.form;f.amtEdited=false;regen(f,true);setTop(f);redrawRows();refreshForm();},
  rowAdd:function(){var f=ui.form;f.rows.push(newRow(f));f.kembali=sumRows(f);f.bunga=Math.max(0,f.kembali-(f.pinjaman||0));render();var el=document.getElementById('sc-form');if(el)el.scrollTop=el.scrollTop+120;},
  rowDel:function(ds){var f=ui.form;f.rows.splice(Number(ds.v),1);f.kembali=sumRows(f);f.bunga=Math.max(0,f.kembali-(f.pinjaman||0));render();},
  openNewType:function(){ui.sheet={kind:'newType',name:'',color:'#A68BF2',mode:'bulanan',ojk:false};render();var el=document.getElementById('nt-name');if(el)el.focus();},
  ntColor:function(ds){ui.sheet.color=ds.v;ui.sheet.ojk=document.getElementById('nt-ojk').checked;render();},
  ntMode:function(ds){ui.sheet.mode=ds.v;ui.sheet.ojk=document.getElementById('nt-ojk').checked;render();},
  saveType:function(){var s=ui.sheet,name=(document.getElementById('nt-name').value||'').trim(),er=document.getElementById('nt-err');if(!name){er.textContent='Nama jenis belum diisi.';return;}if(types().some(function(t){return t.name.toLowerCase()===name.toLowerCase();})){er.textContent='Jenis ini sudah ada.';return;}var before=clone(state);types().push({name:name,color:s.color,mode:s.mode,ojk:document.getElementById('nt-ojk').checked});ui.sheet=null;if(ui.form){ui.form.type=name;if(ui.form.mode==='add'){ui.form.risk=typeRisk(name);if(ui.form.sched!==s.mode)applySched(ui.form,s.mode);}}commit('Jenis "'+name+'" ditambahkan',before);},
  askDelType:function(ds){ui.sheet={kind:'confirm',title:'Hapus jenis '+ds.v+'?',body:'Jenis ini belum dipakai hutang mana pun.',ok:'Hapus',act:'doDelType',id:ds.v};render();},
  doDelType:function(ds){var before=clone(state);state.settings.types=types().filter(function(t){return t.name!==ds.id;});ui.sheet=null;commit('Jenis dihapus',before);},
  fStep:function(ds){var f=ui.form,k=ds.f,v=(f[k]||0)+Number(ds.d);if(k==='tenor')v=Math.max(1,Math.min(120,v));else v=Math.max(0,Math.min(f.rows.length,v));f[k]=v;var el=document.querySelector('#sc-form input[data-f="'+k+'"]');if(el)el.value=v;if(k==='tenor')onDatesChanged();else redrawRows();refreshForm();},
  saveForm:function(){saveForm();},
  fRisk:function(ds){ui.form.risk[ds.k]=ds.v;render();},
  fRiskTog:function(ds){ui.form.risk[ds.k]=!ui.form.risk[ds.k];render();},
  onbNext:function(){ui.onb=2;render();},
  onbBack:function(){ui.onb=1;render();},
  onbBatas:function(ds){state.settings.batas=Number(ds.v);render();},
  onbSave:function(){var el=document.getElementById('onb-gaji');if(el)state.settings.gaji=num(el.value);state.settings.onboarded=true;ui.onb=null;commit(state.settings.gaji?'Penghasilan disimpan':null);},
  onbDone:function(){state.settings.onboarded=true;ui.onb=null;commit();},
  goSettings:function(){ui.tab='more';render();window.scrollTo(0,0);},
  goBackup:function(){ui.tab='more';A.export({v:'json'});},
  export:function(ds){if(ds.v==='json')ui.sheet={kind:'export',title:'Backup data',text:JSON.stringify({app:'STOP RIBA',v:1,exportedAt:new Date().toISOString(),debts:state.debts,settings:state.settings},null,1),filename:'stop-riba-backup-'+todayISO()+'.json'};
    else{var rows=[['Hutang','Jenis','Tenor','Jatuh tempo','Tagihan','Status','Tanggal bayar','Dibayar']];state.debts.forEach(function(d){d.inst.forEach(function(i){rows.push([d.name,d.type,i.n+'/'+d.inst.length,i.due,i.amount,i.paidAt?'Lunas':'Belum',i.paidAt||'',i.paidAt?i.paidAmount:'']);});});ui.sheet={kind:'export',title:'Export CSV',text:rows.map(function(r){return r.map(function(c){c=String(c);return /[",;\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',');}).join('\n'),filename:'stop-riba-'+todayISO()+'.csv'};}
    render();},
  copyExport:function(){var t=document.getElementById('ex-text'),m=document.getElementById('ex-msg');try{navigator.clipboard.writeText(ui.sheet.text).then(function(){m.textContent='Tersalin.';markBackup();},function(){t.select();m.textContent='Tidak bisa salin otomatis. Teks sudah diblok, salin manual.';});}catch(e){t.select();m.textContent='Salin manual dari kotak di atas.';}},
  saveExport:function(){var m=document.getElementById('ex-msg'),s=ui.sheet;var p=(window.claude&&window.claude.use)?window.claude.use('downloads'):Promise.resolve(null);p.then(function(dl){if(!dl){m.textContent='Unduh tidak tersedia di sini. Pakai Salin.';return;}return dl.save({filename:s.filename,data:s.text}).then(function(){m.textContent='File disimpan.';markBackup();},function(){m.textContent='Unduhan dibatalkan.';});}).catch(function(){m.textContent='Unduh tidak tersedia. Pakai Salin.';});},
  openImport:function(){ui.sheet={kind:'import'};render();},
  doImport:function(){var f=document.getElementById('im-file'),t=document.getElementById('im-text').value.trim(),er=document.getElementById('im-err');function apply(txt){try{var o=JSON.parse(txt);if(!o||!Array.isArray(o.debts))throw 0;var ok=o.debts.every(function(d){return d&&d.id&&d.name&&Array.isArray(d.inst);});if(!ok)throw 0;var before=clone(state);state.debts=o.debts;state.settings=o.settings||state.settings;ensureSettings();ui.sheet=null;ui.tab='home';commit('Backup dipulihkan',before);}catch(e){er.textContent='Isi backup tidak valid.';}}
    if(f.files&&f.files[0]){var r=new FileReader();r.onload=function(){apply(String(r.result));};r.onerror=function(){er.textContent='File tidak bisa dibaca.';};r.readAsText(f.files[0]);}else if(t)apply(t);else er.textContent='Pilih file atau tempel isi backup.';}
};
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;var a=A[el.dataset.act];if(!a)return;if(el.dataset.act==='bgClose'){a(el.dataset,el,e);return;}e.preventDefault();a(el.dataset,el,e);});
document.addEventListener('input',function(e){var el=e.target;if(el.dataset&&el.dataset.rk&&ui.form){ui.form.risk[el.dataset.rk]=dec(el.value);var fr=document.getElementById('frisk');if(fr)fr.innerHTML=riskCardHTML(ui.form.risk,ui.form.type);return;}if(el.id==='onb-gaji'){el.value=fmtNum(num(el.value));state.settings.gaji=num(el.value);return;}if(ui.form&&el.dataset&&(el.dataset.ra!=null||el.dataset.rd!=null)){var f=ui.form;if(el.dataset.ra!=null){el.value=fmtNum(num(el.value));var r=f.rows[Number(el.dataset.ra)];if(r)r.amt=num(el.value);if(f.sched!=='manual'&&!f.amtEdited){f.amtEdited=true;var hd=document.getElementById('frows-head');if(hd)hd.innerHTML=rowsHeadHTML();}f.kembali=sumRows(f);f.bunga=Math.max(0,f.kembali-(f.pinjaman||0));setTop(f);}else{var r2=f.rows[Number(el.dataset.rd)];if(r2)r2.due=el.value;}refreshForm();return;}if(el.id==='nt-name'&&ui.sheet)ui.sheet.name=el.value;
  if(el.hasAttribute&&el.hasAttribute('data-money')){var v=num(el.value);el.value=fmtNum(v);}
  if(el.id==='sp-amt'&&ui.sheet&&ui.sheet.kind==='payoff'){var st=stats(findDebt(ui.sheet.id)),v2=num(el.value),o=document.getElementById('sp-save');if(o)o.textContent=v2&&v2<st.sisa?'Hemat '+rp(st.sisa-v2)+' dibanding bayar sesuai jadwal.':'';}
  if(ui.form&&el.dataset&&el.dataset.f&&el.closest('#sc-form')){var k=el.dataset.f;if(el.hasAttribute('data-money'))ui.form[k]=num(el.value);else if(k==='tenor'||k==='paidCount')ui.form[k]=Math.min(120,num(el.value));else if(k==='hari')ui.form[k]=Math.min(3650,num(el.value));else ui.form[k]=el.value;if(['pinjaman','diterima','bunga','kembali'].indexOf(k)>=0)syncMoney(ui.form,k);if(['cair','dueMax','tenor'].indexOf(k)>=0&&ui.form.sched!=='manual')onDatesChanged();else if(k==='cair'||k==='dueMax'){var fl=document.getElementById('flama');if(fl)fl.innerHTML=lamaHTML();}if(k==='paidCount')redrawRows();refreshForm();}
});
document.addEventListener('change',function(e){var el=e.target;if(el.dataset&&el.dataset.s){var k=el.dataset.s,v=num(el.value);if(k==='batas')v=Math.max(1,Math.min(100,v||30));if(k==='capShort'||k==='capLong'){v=dec(el.value);if(!(v>0&&v<10)){el.value=String(state.settings[k]).replace('.',',');return;}}if(state.settings[k]!==v){state.settings[k]=v;commit('Pengaturan disimpan');}}});

loadLocal();if(!state.settings.onboarded)ui.onb=1;render();initCloud();
})();
