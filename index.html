<html lang="id">

<style>
:root{--bg:#101215;--card:#1A1D22;--line:#2A2E35;--tx:#F3F1EC;--mu:#A3A9B1;--acc:#E5372B;--ok:#2BB3A3;--warn:#F2A33A;--in:#0C0E10}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(110px + env(safe-area-inset-bottom))}
.h{font-family:'Space Grotesk',sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.mu{color:var(--mu)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column}
.stack{display:flex;flex-direction:column;gap:12px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:4px}
.btn{min-height:48px;border-radius:14px;border:0;font-weight:700;font-size:15px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-p{background:var(--acc);color:#fff}
.btn-w{background:#fff;color:#101215}
.btn-g{background:var(--card);border:1px solid var(--line);color:var(--tx)}
.btn-d{background:transparent;border:1px solid #6B2A25;color:#FF8E84}
.btn-icon{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.pill{font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;color:var(--mu)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#16191D;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav-in{max-width:480px;margin:0 auto;height:68px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mu);min-height:56px;cursor:pointer}
.nav button.on{color:var(--tx);font-weight:600}
.nav .fab{justify-self:center;width:54px;height:54px;min-height:54px;border-radius:27px;background:var(--acc);color:#fff}
.full{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#15181C;width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
input,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--in);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 12px;width:100%;color-scheme:dark}
textarea{padding:12px;min-height:130px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
input:focus,textarea:focus,button:focus-visible{outline:2px solid #fff;outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.err{color:#FF8E84;font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:#F3F1EC;color:#101215;border-radius:14px;padding:8px 8px 8px 16px;display:flex;gap:12px;align-items:center;z-index:60;font-size:14px;font-weight:600;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast button{background:#101215;color:#fff;border:0;border-radius:10px;min-height:40px;padding:0 12px;font-weight:700;cursor:pointer}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}

.dot{width:6px;height:6px;border-radius:3px;display:inline-block}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--in);padding:4px;border-radius:14px}
.seg button{min-height:42px;border:0;border-radius:11px;background:transparent;color:var(--mu);font-weight:600;font-size:13px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx)}
.typechip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;cursor:pointer;color:var(--tx)}
.typechip.on{background:#fff;color:#101215;border-color:#fff}
.list-btn{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;color:var(--tx);display:block}

.stepper button{width:48px;height:46px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--tx);flex:none}
.stepper input{border:0;text-align:center;background:none;min-height:44px;padding:0;width:100%;min-width:0}
.ck{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.ck span{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:2px solid #5C626B}
.ck.on span{background:var(--ok);border-color:var(--ok);color:#06231F}

.sched{font-size:13px;display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line)}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.small{font-size:12px}
.b{font-weight:700}

.tog{width:48px;height:28px;border-radius:14px;background:#3A3F47;position:relative;flex:none;display:block}
.tog i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;display:block;transition:left .15s}
.tog.on{background:var(--acc)}
.tog.on i{left:23px}

.empty{text-align:center;padding:48px 12px;display:flex;flex-direction:column;gap:14px;align-items:center}

<script>
(function(){

function types(){return state.settings.types;}
function typeOf(n){var t=types();for(var k=0;k<t.length;k++)if(t[k].name===n)return t[k];return {name:n,color:'#A68BF2',mode:'bulanan',ojk:false};}
function tcol(n){return typeOf(n).color;}
var BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var HARI=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
var LS_KEY='stopriba.v1';
function pad(n){return String(n).padStart(2,'0');}
function toISO(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayISO(){return toISO(new Date());}
function parseISO(s){var a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function dim(y,m){return new Date(y,m+1,0).getDate();}
function addMonths(iso,k){var a=iso.split('-').map(Number);var t=new Date(a[0],a[1]-1+k,1);return toISO(new Date(t.getFullYear(),t.getMonth(),Math.min(a[2],dim(t.getFullYear(),t.getMonth()))));}
function addDays(iso,k){var d=parseISO(iso);d.setDate(d.getDate()+k);return toISO(d);}
function daysBetween(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000);}
function dec(s){var v=parseFloat(String(s==null?'':s).replace(',','.'));return isNaN(v)?0:v;}
function pct2(n){return (Math.round(n*1000)/1000).toString().replace('.',',')+'%';}
function daysUntil(iso){return Math.round((parseISO(iso)-parseISO(todayISO()))/86400000);}
function fmtD(iso){var d=parseISO(iso);return d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear();}
function fmtDW(iso){var d=parseISO(iso);return HARI[d.getDay()]+', '+d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear();}
function rp(n){return 'Rp '+Math.round(n||0).toLocaleString('id-ID');}
function shortRp(n){n=Math.round(n||0);if(n>=1e9)return (n/1e9).toFixed(2).replace('.',',')+' M';if(n>=1e6)return (n/1e6).toFixed(2).replace('.',',')+' jt';if(n>=1e3)return Math.round(n/1e3)+' rb';return String(n);}
function num(s){return Number(String(s==null?'':s).replace(/[^\d]/g,''))||0;}
function fmtNum(n){return n?Number(n).toLocaleString('id-ID'):'';}
function pct(n){return (Math.round(n*10)/10).toString().replace('.',',')+'%';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function newId(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36);}
function clone(o){return JSON.parse(JSON.stringify(o));}
var IC={home:'<path d="M3 10.5 12 3l9 7.5V21H3z"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',chart:'<path d="M3 20h18M6 16l4-5 4 3 5-7"/>',more:'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="M20 6 9 17l-5-5"/>',back:'<path d="m15 18-6-6 6-6"/>',next:'<path d="m9 18 6-6-6-6"/>',edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',cloud:'<path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9z"/>',phone:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>',upload:'<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v4h16v-4"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'};
function ic(k,s,w){s=s||20;w=w||2;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[k]+'</svg>';}
var LOGO='<svg width="28" height="28" viewBox="0 0 30 30" aria-hidden="true"><polygon points="9,1 21,1 29,9 29,21 21,29 9,29 1,21 1,9" fill="#E5372B"/><rect x="8" y="13.5" width="14" height="3" rx="1.5" fill="#fff"/></svg>';

/* ---------- state & storage ---------- */
var state={debts:[],settings:{},updatedAt:0};
function ensureSettings(){var s=state.settings=state.settings||{};if(s.gaji==null)s.gaji=0;if(!s.batas)s.batas=30;if(s.capShort==null)s.capShort=0.3;if(s.capLong==null)s.capLong=0.2;if(!Array.isArray(s.types)||!s.types.length)s.types=clone(DEFAULT_TYPES);if(!s.typesV2){['KPR','KKB'].forEach(function(n){if(!s.types.some(function(t){return t.name===n;}))s.types.push(clone(DEFAULT_TYPES.filter(function(t){return t.name===n;})[0]));});s.typesV2=true;}
  if((state.debts||[]).length)s.onboarded=true;
  (state.debts||[]).forEach(function(d){if(!d.risk)d.risk=null;if(!d.mode)d.mode='bulanan';if(d.admin==null)d.admin=0;if(!d.cair)d.cair=d.mode==='harian'?addDays(d.firstDue,-30):addMonths(d.firstDue,-1);if(!s.types.some(function(t){return t.name===d.type;}))s.types.push({name:d.type,color:'#A68BF2',mode:'bulanan',ojk:false});ccLegacy(d);});}
ensureSettings();
var ui={tab:'home',q:'',lType:'Semua',lStatus:null,lSort:'due',lOpen:{},dayOpen:null,calYM:todayISO().slice(0,7),selDay:null,strat:'ava',detail:null,form:null,sheet:null};
var sync='local';
/* QA seed: hanya diisi di build prototype Claude (window.STOPRIBA_SEED), tidak pernah di repo */
function applySeed(){var S=window.STOPRIBA_SEED;if(!S||!Array.isArray(S.debts)||state.seedId===S.id)return false;state.debts=clone(S.debts);state.seedId=S.id;ensureSettings();state.settings.onboarded=true;state.updatedAt=Date.now();saveLocal();return true;}
function loadLocal(){try{var r=localStorage.getItem(LS_KEY);if(r){var s=JSON.parse(r);if(s&&Array.isArray(s.debts))state=s;}}catch(e){}ensureSettings();}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
var docRef=null,saving=false,pendingSave=false,saveTimer=null;
function setSync(s){sync=s;var el=document.getElementById('syncpill');if(el)el.outerHTML=syncPill();}
function scheduleCloud(){if(!docRef)return;clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);}
function flush(){if(!docRef)return;if(saving){pendingSave=true;return;}saving=true;setSync('saving');
  docRef.set({v:1,updatedAt:state.updatedAt,state:clone(state)}).then(function(){setSync('cloud');},function(e){if(e&&e.code==='invalid_argument'){docRef=null;setSync('local');}else setSync('error');}).then(function(){saving=false;if(pendingSave){pendingSave=false;flush();}});}
function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function'){setSync('local');return;}
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user){setSync('local');return;}
    return user.id().then(function(id){
      if(!id){setSync('local');return;}
      var ref=db.doc('data/users/'+id+'/stopriba');
      var timer=setTimeout(function(){setSync('offline');},10000);
      return ref.get().then(function(snap){
        clearTimeout(timer);docRef=ref;
        if(snap.exists){var body=snap.data();if(body&&body.state&&(body.updatedAt||0)>=(state.updatedAt||0)){state=clone(body.state);ensureSettings();var seeded=applySeed();if(state.settings.onboarded)ui.onb=null;saveLocal();render();setSync('cloud');if(seeded)scheduleCloud();}else{setSync('cloud');scheduleCloud();}}
        else{setSync('cloud');if(state.debts.length)scheduleCloud();}
      },function(){clearTimeout(timer);setSync('local');});
    });
  }).catch(function(){setSync('local');});
}
var undoSnap=null;
function commit(msg,undo){if(undo)undoSnap=undo;ccSyncAll();state.updatedAt=Date.now();saveLocal();scheduleCloud();render();if(msg)toast(msg,!!undo);}

/* ---------- domain ---------- */
/* spec: {kembali,tenor,mode:'bulanan'|'harian',firstDue,cair,hari} */
function modeLbl(m){return m==='harian'?'Per hari':m==='manual'?'Manual':'Tiap bulan';}
function dueDates(sp){if(sp.rows)return sp.rows.map(function(r){return r.due;});var a=[];for(var i=0;i<sp.tenor;i++)a.push(sp.mode==='harian'?addDays(sp.cair,Math.round((i+1)*sp.hari/sp.tenor)):addMonths(sp.firstDue,i));return a;}
function buildInst(sp,prev,paidCount){if(sp.rows){return sp.rows.map(function(r,i){var amt=r.amt!=null?r.amt:(r.pokok+r.bunga),p=prev&&prev[i];var o={n:i+1,due:r.due,amount:amt,paidAt:null,paidAmount:0};if(r.pokok!=null&&r.amt!=null){o.pokok=Math.min(r.pokok,amt);o.bunga=amt-o.pokok;}if(p&&p.paidAt){o.paidAt=p.paidAt;o.paidAmount=p.paidAmount;}else if(paidCount&&i<paidCount){o.paidAt=r.due;o.paidAmount=amt;}return o;});}var kembali=sp.kembali,tenor=sp.tenor,dd=dueDates(sp);var per=Math.floor(kembali/tenor),out=[];for(var i=0;i<tenor;i++){var amount=i===tenor-1?kembali-per*(tenor-1):per;var due=dd[i];var p=prev&&prev[i];var o={n:i+1,due:due,amount:amount,paidAt:null,paidAmount:0};if(p&&p.paidAt){o.paidAt=p.paidAt;o.paidAmount=p.paidAmount;}else if(paidCount&&i<paidCount){o.paidAt=due;o.paidAmount=amount;}out.push(o);}return out;}
/* Rates. pinjaman = pokok di kontrak; admin = potongan di awal; dana diterima = pinjaman - admin.
   Flat (cara OJK / brosur): total biaya / pokok / jumlah hari.
   Efektif (bunga riil): IRR harian dari arus kas (terima dana di tanggal cair, bayar tiap tenor), dikonversi ke per bulan. */
function calcRates(o){var P=o.pinjaman||0,adm=o.admin||0,recv=P-adm,flows=o.flows||[],tot=0;flows.forEach(function(f){tot+=f.amt;});
  var biaya=Math.max(0,tot-P+adm),lastDue=flows.length?flows[flows.length-1].due:o.cair,days=Math.max(1,o.cair&&lastDue?daysBetween(o.cair,lastDue):30*(o.tenor||1));
  var r={biaya:biaya,days:days,pctPokok:P?biaya/P*100:0,flatHari:0,flatBulan:0,effBulan:0,effTahun:0,cap:null,over:false};
  if(!P||!recv||recv<=0||!flows.length)return r;
  r.flatHari=biaya/P/days*100;
  r.flatBulan=o.mode!=='bulanan'?r.flatHari*30:biaya/P/(o.tenor||1)*100;
  var t=flows.map(function(f){return Math.max(1,daysBetween(o.cair,f.due));});
  function npv(x){var s=-recv;for(var k=0;k<flows.length;k++)s+=flows[k].amt/Math.pow(1+x,t[k]);return s;}
  if(npv(0)>0){var lo=0,hi=0.05;for(var it=0;it<80;it++){var mid=(lo+hi)/2;if(npv(mid)>0)lo=mid;else hi=mid;}var rd=(lo+hi)/2;r.effBulan=(Math.pow(1+rd,365/12)-1)*100;r.effTahun=r.effBulan*12;}

function annuity(bal,ratePa,n){var r=ratePa/1200;return r?bal*r/(1-Math.pow(1+r,-n)):bal/n;}
/* jadwal anuitas: rateAt(k) = bunga %/thn untuk cicilan ke-k (0-based). Angsuran dihitung ulang tiap bunga berubah. */
function annuityRows(P,dates,rateAt){var n=dates.length,bal=P,pmt=0,prev=null,out=[];
  for(var k=0;k<n;k++){var ra=rateAt(k);if(ra!==prev){pmt=Math.round(annuity(bal,ra,n-k));prev=ra;}var it=Math.round(bal*ra/1200),pk=k===n-1?bal:Math.min(bal,pmt-it);bal-=pk;out.push({due:dates[k],amt:pk+it,pokok:pk});}return out;}
function calcRows(f,dates){var P=f.pinjaman||0,n=dates.length,m=calcMode(f);
  if(!P||!n)return dates.map(function(d){return {due:d,amt:0};});
  if(m==='flat'){if(!(f.rFlat>0))return dates.map(function(d){return {due:d,amt:0};});var B=Math.round(P*f.rFlat/100*n/12),pp=Math.floor(P/n),bb=Math.floor(B/n);return dates.map(function(d,i){var pk=i===n-1?P-pp*(n-1):pp,bu=i===n-1?B-bb*(n-1):bb;return {due:d,amt:pk+bu,pokok:pk};});}
  if(!(f.rFix>0))return dates.map(function(d){return {due:d,amt:0};});var fx=Math.round((f.fixYrs||0)*12),fl=f.rFloat>0?f.rFloat:f.rFix;
  return annuityRows(P,dates,function(k){return fx&&k>=fx?fl:f.rFix;});}
function calcDesc(c){if(!c)return '';if(c.type==='flat')return 'Bunga flat '+pct2(c.rFlat)+'/thn';var t='Anuitas '+pct2(c.rFix)+'/thn';if(c.fixYrs)t+=' fixed '+String(c.fixYrs).replace('.',',')+' thn, lalu '+pct2(c.rFloat||c.rFix)+(c.rFloat?' (perkiraan)':'');(c.changes||[]).forEach(function(x){t+=' · '+pct2(x.rate)+' mulai cicilan '+x.n;});return t;}

/* Semua jadwal = daftar angsuran {due, amt}. Tiap bulan / per hari: tanggal dibuat otomatis, nominal dibagi rata

function sumRows(f){return f.rows.reduce(function(a,r){return a+(r.amt||0);},0);}
function genDates(f){return dueDates({mode:f.sched,tenor:Math.max(1,f.tenor||1),firstDue:f.firstDue,cair:f.cair,hari:f.hari});}

  if(calcMode(f)!=='nominal'){f.rows=calcRows(f,dd);f.amtEdited=false;f.kembali=sumRows(f);f.bunga=Math.max(0,f.kembali-(f.pinjaman||0));return;}
  if(reset||!f.amtEdited){var k=f.kembali||0,per=Math.floor(k/n);f.rows=dd.map(function(due,i){return {due:due,amt:i===n-1?k-per*(n-1):per};});}
  else{var last=old.length?old[old.length-1].amt:0;f.rows=dd.map(function(due,i){return {due:due,amt:old[i]?old[i].amt:last};});f.kembali=sumRows(f);f.bunga=Math.max(0,f.kembali-(f.pinjaman||0));}}

document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;var a=A[el.dataset.act];if(!a)return;if(el.dataset.act==='bgClose'){a(el.dataset,el,e);return;}e.preventDefault();a(el.dataset,el,e);});
function ccInput(el){var ds=el.dataset||{};
  if(ui.form&&isCC(ui.form.type)&&el.closest&&el.closest('#sc-form')){var f=ui.form;
    if(ds.f==='name'){f.name=el.value;return true;}
    if(ds.cf){var k=ds.cf;if(k==='limit'){el.value=fmtNum(num(el.value));f.cc.limit=num(el.value);}else if(k==='rate'||k==='minPct')f.cc[k]=dec(el.value);else f.cc[k]=num(el.value);if(k==='minPct'&&!f.st.minTouched){f.st.min=Math.round(f.st.total*f.cc.minPct/100);var m=document.querySelector('input[data-sf="min"]');if(m)m.value=fmtNum(f.st.min);}return true;}
    if(ds.sf){var k2=ds.sf;if(k2==='cetak'||k2==='due'){f.st[k2]=el.value;return true;}el.value=fmtNum(num(el.value));f.st[k2]=num(el.value);if(k2==='min')f.st.minTouched=true;if(k2==='total'&&!f.st.minTouched){f.st.min=Math.round(f.st.total*f.cc.minPct/100);var m2=document.querySelector('input[data-sf="min"]');if(m2)m2.value=fmtNum(f.st.min);}return true;}
    return false;}
  var s=ui.sheet;if(!s)return false;
  if(s.kind==='ccStmt'&&ds.cs){var v=s.v,k3=ds.cs,d=findDebt(s.id);if(k3==='cetak'||k3==='due'){v[k3]=el.value;return true;}el.value=fmtNum(num(el.value));v[k3]=num(el.value);
    if(k3==='total')v.totalTouched=true;if(k3==='min')v.minTouched=true;
    if(['prev','bunga','belanja','denda'].indexOf(k3)>=0&&!v.totalTouched){v.total=v.prev+v.bunga+v.belanja+v.denda;var t=document.querySelector('input[data-cs="total"]');if(t)t.value=fmtNum(v.total);}
    if(k3!=='min'&&!v.minTouched){v.min=Math.round(v.total*d.cc.minPct/100);var mm=document.querySelector('input[data-cs="min"]');if(mm)mm.value=fmtNum(v.min);}return true;}
  if(s.kind==='ccPay'&&el.id==='ccp-amt'){el.value=fmtNum(num(el.value));s.amt=num(el.value);var d2=findDebt(s.id),st=d2.cc.statements.filter(function(x){return x.id===s.sid;})[0],o=document.getElementById('ccp-sum');if(o)o.innerHTML=ccPaySumHTML(d2,st,s);return true;}
  if(s.kind==='ccPay'&&el.id==='ccp-date'){s.date=el.value;return true;}
  return false;}

});
